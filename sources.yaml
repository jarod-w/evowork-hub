# 上游清单（13 §7.1 G1）。
#
# 每个上游都钉死一个提交：管道只从这个提交采集，上游有新提交时，改这里的 commit 并重跑整条管道，
# 不做增量放行（13 §14「上游漂移」）。新增一个上游需要人工批准，也就是一次 PR 评审。
#
# 字段：
#   id        本清单内唯一，小写短横线
#   repo      上游地址
#   commit    钉死的完整提交号
#   include   只采集这些路径（glob），不写表示整个仓库
#   exclude   明确排除的路径（glob）。用来挡掉同一仓库里许可不同的部分
#   kinds     这个上游提供哪几类条目：skill / connector（专家只收我们自己写的，CLAUDE.md H7）
#   note      为什么收、要注意什么
#
# 首批候选见 13 §7.2。下面是格式示例，全部注释掉；落到实处时逐个核对许可与提交，再取消注释。

sources:
  - id: open-kimi-ppt
    repo: https://github.com/acnlie/open-kimi-ppt-skill
    commit: c32890fe0985bdf668f2722fed30f1010bdf24c9
    include: ["skills/open-kimi-ppt/**"]
    kinds: [skill]
    note: >-
      用户指定的演示文稿技能，仓库级 MIT。上游原版 G4 缺 yaml、websocket，且运行时自动安装工具。
      content/skills/open-kimi-ppt 是适配后的托管版本：依赖随包、办公组件本地转 PPTX、专用浏览器仅做图片校验。
      已过 G2–G4、禁用用户包测试、本地 PPTX/原生元素回读和真实 Chrome 图片导出；高级能力限制见适配说明。

  - id: mattpocock-skills
    repo: https://github.com/mattpocock/skills
    commit: abeeaf95660ba9e8b7c753eb38f441ca707a8823
    include:
      - skills/engineering/tdd/**
      - skills/engineering/diagnosing-bugs/**
      - skills/engineering/code-review/**
      - skills/engineering/to-spec/**
      - skills/engineering/triage/**
      - skills/engineering/implement/**
      - skills/engineering/domain-modeling/**
      - skills/engineering/codebase-design/**
      - skills/engineering/prototype/**
      - skills/engineering/to-tickets/**
      - skills/engineering/improve-codebase-architecture/**
      - skills/productivity/handoff/**
      - skills/productivity/grill-me/**
      - skills/productivity/teach/**
    kinds: [skill]
    note: >-
      仓库级 MIT。只收录说明型技能，不收带特定宿主名称的条目。
      content/skills 下对应目录是托管版本：中文展示文案，默认不进提示词。
      拆成任务不再指向上游的安装向导；架构加深改为调用已收录的 grill-me。

  - id: cloudflare-skills
    repo: https://github.com/cloudflare/skills
    commit: 5108325ecceabc899c761e07aa617b09c02445ee
    include:
      - skills/workers-best-practices/**
      - skills/web-perf/**
    kinds: [skill]
    note: 仓库级 Apache-2.0。只收录这两份说明，上游没有单独的 NOTICE。

  - id: aahl-skills
    repo: https://github.com/aahl/skills
    commit: 47edd621dff44253677d2ed14c223393ca020407
    include: ["skills/cn-stats/**"]
    kinds: [skill]
    note: 仓库级 MIT。国家统计局公开接口查询说明，不带密钥。

  - id: ai-marketing-skills
    repo: https://github.com/ericosiu/ai-marketing-skills
    commit: c715f900e3a7c1f4274976ca851849d9a7c3fe55
    include: ["content-eval/**"]
    kinds: [skill]
    note: 仓库级 MIT。只收录内容评估说明，README 里的宿主名称已改成通用说法。

  - id: deep-research-skills
    repo: https://github.com/Weizhena/Deep-Research-skills
    commit: 6ce38f60e3f8b22502c29873f96503a4e0c5addb
    include:
      - skills/research-zh/research-report/**
      - skills/research-zh/research/SKILL.md
    kinds: [skill]
    note: >-
      仓库级 MIT。收录中文调研提纲和调研报告。提纲去掉其他宿主的工具名单，
      不收录依赖 PyYAML 的 validate_json.py。

  - id: academic-citation-manager
    repo: https://github.com/YouStudyeveryday/academic-citation-manager
    commit: 372286ce1acae58bc0c6cd4270282ff07ef95ea7
    include:
      - SKILL.md
      - academic_citation_skill.py
      - batch_import.py
      - citation_styles.json
      - crossref_config.json
      - reference_database.json
    kinds: [skill]
    note: >-
      仓库根 LICENSE 是 Apache-2.0，上游没有 NOTICE。SKILL.md frontmatter 写了 MIT，
      与许可证正文不一致，托管版本以 LICENSE 为准。HTTP 改为标准库，不收录要求安装第三方包的说明。

