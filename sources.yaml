# 上游清单（13 §7.1 G1）。
#
# 每个上游都钉死一个提交：管道只从这个提交采集，上游有新提交时，改这里的 commit 并重跑整条管道，
# 不做增量放行（13 §14「上游漂移」）。新增一个上游需要人工批准，也就是一次 PR 评审。
#
# 字段：
#   id        本清单内唯一，小写短横线
#   repo      上游地址
#   commit    钉死的完整提交号
#   include   只采集这些路径（glob），不写表示整个仓库
#   exclude   明确排除的路径（glob）。用来挡掉同一仓库里许可不同的部分
#   kinds     这个上游提供哪几类条目：skill / connector（专家只收我们自己写的，CLAUDE.md H7）
#   note      为什么收、要注意什么
#
# 首批候选见 13 §7.2。下面是格式示例，全部注释掉；落到实处时逐个核对许可与提交，再取消注释。

sources: []

# - id: anthropics-skills
#   repo: https://github.com/anthropics/skills
#   commit: <完整提交号>
#   include: ["<示例技能所在路径>/**"]
#   exclude: ["<文档类技能所在路径>/**"]   # docx / pptx / xlsx / pdf 是 source-available，不是开源（13 §2.4）；路径按钉死的那个提交核对
#   kinds: [skill]
#   note: 只收 Apache-2.0 的示例技能
#
# - id: openai-plugins
#   repo: https://github.com/openai/plugins
#   commit: <完整提交号>
#   include: ["plugins/*/skills/**", "plugins/*/.mcp.json"]
#   kinds: [skill, connector]
#   note: >-
#     许可按插件级判断后还要逐个技能核对（13 §2.3）；ChatGPT Apps（.app.json）一律不收（CLAUDE.md H9）；
#     没写许可的只进索引、不进本仓库（CLAUDE.md H1）
